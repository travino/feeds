name: Deploy Cloudflare Pages

# -------------------------------------------------------------------------
# DORMANT BY DESIGN. This is the "spare tire" — GitHub Pages stays the live
# deploy until you decide to switch. Nothing here runs automatically and
# nothing is created until you act, so no bridge is burned yet.
#
# To go live on Cloudflare:
#   1. Create a Cloudflare Pages project using DIRECT UPLOAD (not Git):
#        npx wrangler pages project create feedseek --production-branch main
#      ^ One-way door: a Direct Upload project CANNOT later be converted to
#        Git integration. Reuses site/build_site.py and ignores the
#        500 builds/mo cap entirely, which is why we picked it.
#   2. Add two repo secrets (Settings -> Secrets and variables -> Actions):
#        CLOUDFLARE_API_TOKEN    (token with "Cloudflare Pages: Edit")
#        CLOUDFLARE_ACCOUNT_ID
#   3. Adjust PROJECT_NAME / SITE_URL below if your project name differs.
#   4. Run it once: Actions -> Deploy Cloudflare Pages -> Run workflow.
#   5. (Optional) Uncomment the `workflow_run` block to auto-deploy after
#      each "Update Feeds" run, and disable the GitHub Pages workflow.
# -------------------------------------------------------------------------

on:
  workflow_dispatch:
  # Activate auto-deploy later by uncommenting:
  # workflow_run:
  #   workflows: ["Update Feeds"]
  #   types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: feedseek
  SITE_URL: https://feedseek.pages.dev/ # your public URL; used in canonical/feed links

jobs:
  build-deploy:
    # When triggered manually this always runs; the workflow_run guard only
    # matters once that trigger is uncommented above.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # setup-uv caches by default. This job publishes through
          # wrangler-action, so a poisoned cache entry would reach the deploy;
          # turn it off rather than suppress the cache-poisoning audit.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Build site
        working-directory: .
        run: |
          uv run --locked site/build_site.py
          uv run --locked site/build_search_index.py
          uv run --locked site/make_favicon.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.PROJECT_NAME }} --branch=main
