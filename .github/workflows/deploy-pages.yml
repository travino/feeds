name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  # zizmor: ignore[dangerous-triggers] deploy-after-build on our own workflow; checks out default ref, no untrusted PR code
  workflow_run:
    workflows: ["Update Feeds"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # Update Feeds publishes successful partial output before applying its health gate,
    # so deploy after every completed run and always build from the current default branch.
    runs-on: ubuntu-slim
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # No restorable cache: this job builds the artifact that
          # actions/deploy-pages publishes, and cache entries written on a
          # branch are readable here. Same reasoning as deploy-cloudflare-pages.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build site
        working-directory: .
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          uv run --locked site/build_site.py
          uv run --locked site/build_search_index.py
          uv run --locked site/make_favicon.py
          sed -i '/google-site-verification/a\  <meta name="msvalidate.01" content="23A368B2C5F4DF3471A67EA6CB057149" />' public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
