name: Temporary Stripe SaaS patch

on:
  push:
    branches: [feeds/saas-stripe]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'gptomek[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          python-version: '3.14'
      - name: Apply Stripe source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('feed_generators/saas.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one patch anchor, found {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    - Netlify           blog + changelog + knowledge base (native RSS)\n',
              '    - Netlify           blog + changelog + knowledge base (native RSS)\n'
              '    - Stripe            newsroom + developer blog + API changelog (scraped)\n',
          )
          replace_once(
              '    "and Netlify (blog + changelog + knowledge base)."\n',
              '    "Netlify (blog + changelog + knowledge base), and "\n'
              '    "Stripe (newsroom + developer blog + API changelog)."\n',
          )
          replace_once(
              'def doc_sources():\n    return [\n        ("CodeRabbit Newsroom", CODERABBIT_NEWSROOM_URL),\n        ("Postman App Release Notes", POSTMAN_APP_RELEASE_NOTES_URL),\n    ]\n',
              'def doc_sources():\n    return [\n        ("CodeRabbit Newsroom", CODERABBIT_NEWSROOM_URL),\n        ("Postman App Release Notes", POSTMAN_APP_RELEASE_NOTES_URL),\n        ("Stripe Newsroom", STRIPE_NEWSROOM_URL),\n        ("Stripe Developer Blog", STRIPE_DEV_URL),\n        ("Stripe Changelog", STRIPE_CHANGELOG_URL),\n    ]\n',
          )

          stripe_block = r'''
# --------------------------------------------------------------------------- #
# Stripe: all three requested surfaces are server-rendered but expose no
# reliable native feed. Keep the public URLs as the documented sources and use
# their fuller listing pages internally where available.
# --------------------------------------------------------------------------- #
STRIPE_NEWSROOM_URL = "https://stripe.com/en-pl/newsroom"
_STRIPE_NEWSROOM_LIST_URL = "https://stripe.com/en-pl/newsroom/news"
STRIPE_DEV_URL = "https://stripe.dev/"
_STRIPE_DEV_BLOG_URL = "https://stripe.dev/blog"
STRIPE_CHANGELOG_URL = "https://docs.stripe.com/changelog"
STRIPE_MAX_ENTRIES = 50
_STRIPE_NEWS_DATE_RE = re.compile(r"\b\d{1,2}\s+[A-Z][a-z]+\s+20\d{2}\b")
_STRIPE_DEV_DATE_RE = re.compile(r"\b20\d{2}\.\d{1,2}\.\d{1,2}\b")
_STRIPE_CHANGELOG_LINK_RE = re.compile(
    r"/changelog/(?:[a-z0-9-]+/)?(20\d{2}-\d{2}-\d{2})/[^?#]+",
    re.I,
)


def _stripe_date(value: str):
    """Parse Stripe's three listing-date formats into UTC datetimes."""
    parsed = multi_rss.parse_date(value)
    if parsed is not None:
        return parsed
    for fmt in ("%d %B %Y", "%Y.%m.%d", "%Y-%m-%d"):
        try:
            return datetime.strptime(value.strip(), fmt).replace(tzinfo=timezone.utc)
        except ValueError:
            pass
    return None


def _stripe_link(href: str, base: str) -> str:
    href = (href or "").split("?", 1)[0].split("#", 1)[0]
    return href if href.startswith("http") else base + href


def parse_stripe_newsroom(html: str, known_links: set[str] | None = None) -> list[dict]:
    """Parse Stripe newsroom cards without depending on presentation classes."""
    known_links = known_links or set()
    grouped: dict[str, list[str]] = {}
    soup = BeautifulSoup(html or "", "html.parser")
    for anchor in soup.select("a[href*='/newsroom/news/']"):
        link = _stripe_link(anchor.get("href", ""), "https://stripe.com")
        if link.rstrip("/").endswith("/newsroom/news"):
            continue
        text = re.sub(r"\s+", " ", anchor.get_text(" ", strip=True)).strip()
        if text:
            grouped.setdefault(link, []).append(text)

    out = []
    for link, texts in grouped.items():
        if link in known_links:
            continue
        date_text = next((t for t in texts if _STRIPE_NEWS_DATE_RE.fullmatch(t)), "")
        titles = [
            t for t in texts
            if not _STRIPE_NEWS_DATE_RE.fullmatch(t)
            and t.lower() not in {"product", "corporate", "latest"}
            and len(t) >= 12
        ]
        if not titles:
            continue
        title = sanitize_xml(max(titles, key=len))[:200]
        out.append({
            "id": link,
            "title": title,
            "link": link,
            "date": _stripe_date(date_text) or stable_fallback_date(link),
            "description": title,
            "content_html": None,
            "source": "Stripe Newsroom",
        })
    out.sort(key=lambda e: e["date"], reverse=True)
    return out[:STRIPE_MAX_ENTRIES]


def parse_stripe_dev_blog(html: str, known_links: set[str] | None = None) -> list[dict]:
    """Parse stripe.dev blog cards, whose visible metadata includes YYYY.M.DD."""
    known_links = known_links or set()
    soup = BeautifulSoup(html or "", "html.parser")
    out, seen = [], set()
    for anchor in soup.select("a[href]"):
        href = anchor.get("href", "")
        if not re.search(r"(?:^|stripe\.dev)/blog/[^/?#]+", href):
            continue
        link = _stripe_link(href, "https://stripe.dev")
        if link in seen or link in known_links:
            continue
        card = anchor
        card_text = re.sub(r"\s+", " ", card.get_text(" ", strip=True)).strip()
        for _ in range(5):
            if _STRIPE_DEV_DATE_RE.search(card_text):
                break
            if not getattr(card, "parent", None):
                break
            card = card.parent
            card_text = re.sub(r"\s+", " ", card.get_text(" ", strip=True)).strip()
        date_match = _STRIPE_DEV_DATE_RE.search(card_text)
        if not date_match:
            continue
        title = re.sub(r"\s+", " ", anchor.get_text(" ", strip=True)).strip()
        title = _STRIPE_DEV_DATE_RE.sub("", title).strip(" ·—-|")
        if len(title) < 8 or title.lower() in {"read", "read more"}:
            heading = card.find(["h1", "h2", "h3", "h4"])
            title = heading.get_text(" ", strip=True) if heading else ""
        if not title:
            continue
        title = sanitize_xml(title)[:200]
        seen.add(link)
        out.append({
            "id": link,
            "title": title,
            "link": link,
            "date": _stripe_date(date_match.group(0)) or stable_fallback_date(link),
            "description": title,
            "content_html": None,
            "source": "Stripe Developer Blog",
        })
    out.sort(key=lambda e: e["date"], reverse=True)
    return out[:STRIPE_MAX_ENTRIES]


def parse_stripe_changelog(html: str, known_links: set[str] | None = None) -> list[dict]:
    """Parse dated Stripe API changelog links and canonicalize Markdown URLs."""
    known_links = known_links or set()
    soup = BeautifulSoup(html or "", "html.parser")
    out, seen = [], set()
    for anchor in soup.select("a[href*='/changelog/']"):
        link = _stripe_link(anchor.get("href", ""), "https://docs.stripe.com")
        match = _STRIPE_CHANGELOG_LINK_RE.search(link)
        if not match:
            continue
        if link.endswith(".md"):
            link = link[:-3]
        if link in seen or link in known_links:
            continue
        title = sanitize_xml(anchor.get_text(" ", strip=True))[:200]
        if not title:
            continue
        seen.add(link)
        out.append({
            "id": link,
            "title": title,
            "link": link,
            "date": _stripe_date(match.group(1)) or stable_fallback_date(link),
            "description": title,
            "content_html": None,
            "source": "Stripe Changelog",
        })
    out.sort(key=lambda e: e["date"], reverse=True)
    return out[:STRIPE_MAX_ENTRIES]


def collect_stripe(known_links: set[str]) -> list[dict]:
    """Collect Stripe surfaces independently so one outage cannot sink the rest."""
    out: list[dict] = []
    sources = (
        ("Stripe Newsroom", _STRIPE_NEWSROOM_LIST_URL, parse_stripe_newsroom),
        ("Stripe Developer Blog", _STRIPE_DEV_BLOG_URL, parse_stripe_dev_blog),
        ("Stripe Changelog", STRIPE_CHANGELOG_URL, parse_stripe_changelog),
    )
    for label, url, parser in sources:
        try:
            html = multi_rss.get_html(url)
            if not html:
                logger.warning("%s unavailable; continuing", label)
                continue
            entries = parser(html, known_links)
            out.extend(entries)
            logger.info("%s: %d entries", label, len(entries))
        except Exception as exc:
            logger.warning("%s failed: %s", label, exc)
    return out

'''
          marker = '# --------------------------------------------------------------------------- #\n# Feed\n# --------------------------------------------------------------------------- #\n'
          replace_once(marker, stripe_block + marker)
          replace_once(
              '        + collect_native_feeds(known_links)\n        + collect_coderabbit_newsroom(known_links)\n',
              '        + collect_native_feeds(known_links)\n        + collect_stripe(known_links)\n        + collect_coderabbit_newsroom(known_links)\n',
          )
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_saas_stripe.py')
          test.write_text(r'''import sys
import unittest
from pathlib import Path

sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "feed_generators"))

import saas  # noqa: E402


class StripeSaaSSourcesTests(unittest.TestCase):
    def test_requested_public_sources_are_documented(self):
        sources = dict(saas.doc_sources())
        self.assertEqual(sources["Stripe Newsroom"], "https://stripe.com/en-pl/newsroom")
        self.assertEqual(sources["Stripe Developer Blog"], "https://stripe.dev/")
        self.assertEqual(sources["Stripe Changelog"], "https://docs.stripe.com/changelog")

    def test_newsroom_parser_pairs_title_and_date_links(self):
        html = """
        <a href="/en-pl/newsroom/news/example-launch">Example Stripe launch for developers</a>
        <a href="/en-pl/newsroom/news/example-launch">21 July 2026</a>
        """
        entries = saas.parse_stripe_newsroom(html)
        self.assertEqual(len(entries), 1)
        self.assertEqual(entries[0]["title"], "Example Stripe launch for developers")
        self.assertEqual(entries[0]["date"].isoformat(), "2026-07-21T00:00:00+00:00")
        self.assertEqual(entries[0]["source"], "Stripe Newsroom")

    def test_dev_blog_parser_uses_visible_dot_date(self):
        html = """
        <article>
          <a href="/blog/building-projects">2026.8.28 Building projects with Stripe</a>
        </article>
        """
        entries = saas.parse_stripe_dev_blog(html)
        self.assertEqual(len(entries), 1)
        self.assertEqual(entries[0]["title"], "Building projects with Stripe")
        self.assertEqual(entries[0]["date"].isoformat(), "2026-08-28T00:00:00+00:00")
        self.assertEqual(entries[0]["source"], "Stripe Developer Blog")

    def test_changelog_parser_canonicalizes_markdown_links(self):
        html = """
        <a href="https://docs.stripe.com/changelog/dahlia/2026-07-29/example-change.md">
          Adds an example API field
        </a>
        """
        entries = saas.parse_stripe_changelog(html)
        self.assertEqual(len(entries), 1)
        self.assertEqual(
            entries[0]["link"],
            "https://docs.stripe.com/changelog/dahlia/2026-07-29/example-change",
        )
        self.assertEqual(entries[0]["date"].isoformat(), "2026-07-29T00:00:00+00:00")
        self.assertEqual(entries[0]["source"], "Stripe Changelog")

    def test_known_links_are_filtered(self):
        link = "https://docs.stripe.com/changelog/dahlia/2026-07-29/example-change"
        html = f'<a href="{link}.md">Example change</a>'
        self.assertEqual(saas.parse_stripe_changelog(html, {link}), [])


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY
      - name: Test and regenerate source docs
        run: |
          uv run --locked pytest tests/test_saas_stripe.py tests/test_requested_feed_sources.py -q
          uv run --locked feed_generators/docs_sources.py
      - name: Commit final patch
        shell: bash
        run: |
          rm .github/workflows/tmp-stripe-patch.yml
          git config user.name 'gptomek[bot]'
          git config user.email 'gptomek[bot]@users.noreply.github.com'
          git add feed_generators/saas.py tests/test_saas_stripe.py docs/sources.md .github/workflows/tmp-stripe-patch.yml
          git commit -m 'feeds: add Stripe sources to SaaS'
          git push origin HEAD:feeds/saas-stripe
