name: Temporary Stripe test isolation fix

on:
  push:
    branches:
      - feeds/saas-stripe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          python-version: "3.14"
      - name: Patch existing SaaS isolation test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_saas_coderabbit.py")
          text = path.read_text(encoding="utf-8")
          old = '            "collect_native_feeds",\n            "collect_coderabbit_newsroom",\n'
          new = '            "collect_native_feeds",\n            "collect_stripe",\n            "collect_coderabbit_newsroom",\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one patch anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run full unit suite
        run: uv run --locked python -m unittest discover -s tests
      - name: Commit tested fix
        run: |
          rm .github/workflows/tmp-stripe-test-fix.yml
          git config user.name "gptomek[bot]"
          git config user.email "gptomek[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: isolate Stripe collector in SaaS cache cleanup"
          git push origin HEAD:feeds/saas-stripe
